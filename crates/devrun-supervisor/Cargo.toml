[package]
name = "devrun-supervisor"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nix = { version = "0.32.0", features = ["signal", "process"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
