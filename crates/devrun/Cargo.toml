[package]
name = "devrun"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
cliclack = "0.5.7"
console = "0.16.6"
crossterm = "0.29.0"
devrun-domain = { path = "../devrun-domain" }
devrun-supervisor = { path = "../devrun-supervisor" }
glob = "0.3.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.2.2"
tui-term = "0.3.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true
